name: CRM Product Verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
  SUPABASE_SERVICE_ROLE_KEY: BUILD_TIME_PLACEHOLDER_KEY

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - run: npm run quality:knowledge
      - run: npm run quality:legacy
      - run: npm run quality:invariants
      - run: npm run context:test
      - run: node scripts/engineering/os-bootstrap-test.mjs --evidence .zerograph-evidence/probes.json
      - run: npm run engineering:eval
      - name: Require immutable R3 task contract
        env:
          { BASE_SHA: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: npm run task:contract:check -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: npm run semantic:graph
      - run: npm run os:acceptance -- --mode preflight
      - name: Compile exact-head impact and proof plan
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: |
          npm run impact:compile -- --base "$BASE_SHA" --head "$HEAD_SHA"
          npm run proof:plan -- --base "$BASE_SHA" --head "$HEAD_SHA"
          npm run verify:affected -- --kind unit --base "$BASE_SHA" --head "$HEAD_SHA"
          npm run verify:affected -- --kind handover --execute --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check changed diff integrity
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - run: npm run typecheck
      - name: Run related Jest tests for changed source
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: |
          mapfile -d '' changed_source < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- src)
          affected=()
          for candidate in "${changed_source[@]}"; do case "$candidate" in *.ts|*.tsx|*.js|*.jsx) affected+=("$candidate");; esac; done
          if [ "${#affected[@]}" -eq 0 ]; then echo "No Jest-related source changes."; else npm test -- --runInBand --findRelatedTests "${affected[@]}"; fi
      - name: Write preflight evidence
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: node scripts/engineering/release-evidence.mjs --kind preflight --base "$BASE_SHA" --head "$HEAD_SHA" --output .zerograph-evidence/preflight.json
      - uses: actions/upload-artifact@v4
        with:
          {
            name: zerograph-preflight,
            path: .zerograph-evidence,
          }

  unit-build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run build
      - name: Write unit/build evidence
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: node scripts/engineering/release-evidence.mjs --kind unit-build --base "$BASE_SHA" --head "$HEAD_SHA" --output .zerograph-evidence/unit-build.json
      - uses: actions/upload-artifact@v4
        with:
          {
            name: zerograph-unit-build,
            path: .zerograph-evidence/unit-build.json,
          }

  receivables-postgres:
    needs: preflight
    if: always() && needs.preflight.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          {
            POSTGRES_USER: postgres,
            POSTGRES_PASSWORD: postgres,
            POSTGRES_DB: postgres,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      {
        PGHOST: localhost,
        PGPORT: 5432,
        PGDATABASE: postgres,
        PGUSER: postgres,
        PGPASSWORD: postgres,
      }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Activate preinstalled PostgreSQL client
        run: |
          pg_bin="$(pg_config --bindir)"; test -x "$pg_bin/psql"; test -x "$pg_bin/createdb"; echo "$pg_bin" >> "$GITHUB_PATH"; "$pg_bin/psql" --version
      - name: Run affected PostgreSQL proof plan
        env:
          {
            CI: "true",
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: node scripts/engineering/verify-affected.mjs --kind postgres --execute --base "$BASE_SHA" --head "$HEAD_SHA" --evidence .zerograph-evidence/evidence-postgres.json
      - uses: actions/upload-artifact@v4
        with:
          {
            name: zerograph-postgres,
            path: .zerograph-evidence/evidence-postgres.json,
          }

  e2e:
    needs: [preflight, unit-build]
    if: always() && needs.preflight.result != 'cancelled' && needs.unit-build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      {
        image: "mcr.microsoft.com/playwright:v1.54.2-noble",
        options: --ipc=host,
      }
    env:
      {
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright,
        CI: "true",
        PLAYWRIGHT_E2E_WEBPACK: "true",
      }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24.13.0, cache: npm }
      - name: Trust the container-mounted exact-head checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run build
      - name: Run affected E2E proof plan and fail on flakes
        env:
          {
            BASE_SHA: "${{ github.event.pull_request.base.sha }}",
            HEAD_SHA: "${{ github.event.pull_request.head.sha }}",
          }
        run: node scripts/engineering/verify-affected.mjs --kind e2e --execute --base "$BASE_SHA" --head "$HEAD_SHA" --evidence .zerograph-evidence/evidence-e2e.json
      - uses: actions/upload-artifact@v4
        with:
          { name: zerograph-e2e, path: .zerograph-evidence/evidence-e2e.json }

  verify:
    needs: [preflight, unit-build, receivables-postgres, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          {
            pattern: zerograph-*,
            path: .zerograph-evidence,
            merge-multiple: true,
          }
      - name: Require exact PR head and complete jobs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "${{ needs.preflight.result }}:${{ needs.unit-build.result }}:${{ needs.receivables-postgres.result }}:${{ needs.e2e.result }}" = "success:success:success:success"
      - name: Emit final exact-head repository certificate
        env:
          ZEROGRAPH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ZEROGRAPH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZEROGRAPH_EVIDENCE_DIR: .zerograph-evidence
        run: |
          npm run task:acceptance:check -- --evidence .zerograph-evidence --base "$ZEROGRAPH_BASE_SHA" --head "$ZEROGRAPH_HEAD_SHA"
          echo "TASK_ACCEPTANCE_COMPLETE"
          result="$(npm run --silent quality:release)"
          echo "$result"
          echo "$result" | grep -q '"releaseReady":true'
          echo "REPOSITORY_RELEASE_CANDIDATE_READY"
