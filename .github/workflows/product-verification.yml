name: CRM Product Verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
  KERNEL_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
  KERNEL_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - run: npm run kernel:doctor -- --ci
      - name: Compile canonical impact and proof plan
        env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          npm run impact:compile -- --base "$BASE_SHA" --head "$HEAD_SHA"
          npm run proof:plan -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Execute exact planned unit proofs
        run: npm run proof:run -- --kind unit --base "$KERNEL_BASE_SHA" --head "$KERNEL_HEAD_SHA"
      - name: Diff integrity and related tests
        env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          mapfile -d '' changed_source < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- src)
          affected=()
          for candidate in "${changed_source[@]}"; do case "$candidate" in *.ts|*.tsx|*.js|*.jsx) affected+=("$candidate");; esac; done
          if [ "${#affected[@]}" -gt 0 ]; then npm test -- --runInBand --findRelatedTests "${affected[@]}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: kernel-preflight, path: artifacts/engineering-evidence/*.json, if-no-files-found: error }

  unit-build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - name: Execute exact planned build proofs
        run: npm run proof:run -- --kind build --base "$KERNEL_BASE_SHA" --head "$KERNEL_HEAD_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: kernel-unit-build, path: artifacts/engineering-evidence/*.json, if-no-files-found: error }

  receivables-postgres:
    needs: preflight
    if: always() && needs.preflight.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGDATABASE: postgres, PGUSER: postgres, PGPASSWORD: postgres, CI: "true" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - name: Activate preinstalled PostgreSQL client
        run: |
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/psql"
          test -x "$pg_bin/createdb"
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Execute exact planned PostgreSQL proofs
        run: node scripts/engineering/proof-runner.mjs --proof control-postgres-matrix --kind postgres --base "$KERNEL_BASE_SHA" --head "$KERNEL_HEAD_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: kernel-postgres, path: artifacts/engineering-evidence/*.json, if-no-files-found: error }

  e2e:
    needs: [preflight, unit-build]
    if: always() && needs.preflight.result != 'cancelled' && needs.unit-build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "mcr.microsoft.com/playwright:v1.54.2-noble", options: --ipc=host }
    env: { PLAYWRIGHT_BROWSERS_PATH: /ms-playwright, CI: "true", PLAYWRIGHT_E2E_WEBPACK: "true" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.13.0, cache: npm }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run build
      - name: Execute exact planned E2E proofs
        run: npm run proof:run -- --kind e2e --base "$KERNEL_BASE_SHA" --head "$KERNEL_HEAD_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: kernel-e2e, path: artifacts/engineering-evidence/*.json, if-no-files-found: error }

  verify:
    needs: [preflight, unit-build, receivables-postgres, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.13.0, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: kernel-*, path: artifacts/engineering-evidence, merge-multiple: true }
      - name: Validate complete exact-head evidence
        env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}" }
        run: >-
          npm run proof:certify-ci -- --base "$BASE_SHA" --head "$HEAD_SHA"
          --jobs "${{ needs.preflight.result }}:${{ needs.unit-build.result }}:${{ needs.receivables-postgres.result }}:${{ needs.e2e.result }}"
