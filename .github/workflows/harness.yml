name: CRM Engineering Graph + Product Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      graph_only: ${{ steps.scope.outputs.graph_only }}
      classification: ${{ steps.scope.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify pull request scope fail-safe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          classification="$(node tools/crm-graph/scripts/classify-ci-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "classification=$classification"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          if [ "$classification" = "graph_only" ]; then
            echo "graph_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "graph_only=false" >> "$GITHUB_OUTPUT"
          fi

  receivables-postgres:
    needs: classify
    if: needs.classify.outputs.graph_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receivables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receivables_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: receivables_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Activate preinstalled PostgreSQL client
        run: |
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/psql"
          test -x "$pg_bin/createdb"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/psql" --version
      - name: Prove financial fixtures refuse the production project
        run: |
          set +e
          PGHOST=gwfjkpsoaoherntwhdyf.supabase.co bash scripts/receivables-db/run-integration.sh
          status=$?
          set -e
          test "$status" -eq 86
      - name: Apply migration and run Receivables database integration
        run: bash scripts/receivables-db/run-integration.sh
      - name: Fresh-apply Field Visits lifecycle migration and prove historic compatibility
        run: createdb field_visits_test && PGDATABASE=field_visits_test bash scripts/field-visits-db/run-integration.sh
      - name: Prove Attendance uniqueness and permanent-row evidence lifecycle
        run: createdb attendance_test && PGDATABASE=attendance_test bash scripts/attendance-db/run-integration.sh
      - name: Fresh-apply Pipeline authority migrations and prove isolation
        run: createdb pipeline_test && PGDATABASE=pipeline_test bash scripts/pipeline-db/run-integration.sh
      - name: Fresh-apply Distributor Status migration and prove concurrency, isolation, and 10k scale
        run: createdb distributor_status_test && PGDATABASE=distributor_status_test bash scripts/distributor-status-db/run-integration.sh
      - name: Fresh-apply Migration 046 and prove master-import atomicity and payment concurrency
        run: createdb distributor_master_test && CRM_MASTER_DB_DISPOSABLE=1 PGDATABASE=distributor_master_test bash scripts/distributor-master-db/run-integration.sh

  verify:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      SUPABASE_SERVICE_ROLE_KEY: BUILD_TIME_PLACEHOLDER_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install product dependencies for full verification
        if: needs.classify.outputs.graph_only != 'true'
        run: npm ci

      - name: Install CRM Engineering Graph dependencies
        run: npm ci --prefix tools/crm-graph

      - name: Typecheck CRM Engineering Graph
        run: npm run crm:graph:typecheck

      - name: Test CRM Engineering Graph
        run: npm run crm:graph:test

      - name: Load changed authoritative Graph task state
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -d '' changed_tasks < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '.crm-engineering/tasks/*.json')
          if [ "${#changed_tasks[@]}" -eq 0 ]; then
            echo "No changed Graph tasks; continuing."
          else
            for task_file in "${changed_tasks[@]}"; do
              test -f "$task_file"
              task_id="$(node -e 'const fs=require("fs"); const task=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!task.taskId) process.exit(2); process.stdout.write(task.taskId);' "$task_file")"
              npm run crm:status -- --task "$task_id"
            done
          fi

      - name: Check changed diff integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - if: needs.classify.outputs.graph_only != 'true'
        run: npm run typecheck
      - if: needs.classify.outputs.graph_only != 'true'
        run: npm test -- --runInBand
      - if: needs.classify.outputs.graph_only != 'true'
        run: npm run lint
      - if: needs.classify.outputs.graph_only != 'true'
        run: npm run build

  e2e:
    needs: classify
    if: needs.classify.outputs.graph_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.54.2-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      SUPABASE_SERVICE_ROLE_KEY: BUILD_TIME_PLACEHOLDER_KEY
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Receivables browser authorization and intake flows
        run: npm run test:e2e:receivables
      - name: Run Field Visits and Attendance evidence browser flows
        run: npm run test:e2e:field-visits
      - name: Run Distributor route and Attendance write-to-read closure flows
        run: npx playwright test e2e/distributors e2e/attendance
        env:
          PLAYWRIGHT_E2E_WEBPACK: "true"
      - name: Run Pipeline visibility, ownership, creation, and request-budget flows
        run: npm run test:e2e:pipeline
        env:
          PLAYWRIGHT_E2E_WEBPACK: "true"
